# Volume 9 of The GRH Lean Handbook. The plan is spec 07.3 and 07.4. The number of a chapter is its
# place in this list. A chapter is written when its folder has section files NN-<slug>.md.
number: 9
title: 'Theorem A: short forms'
summary: >-
