# Volume 6 of The GRH Lean Handbook. The plan is spec 07.3 and 07.4. The number of a chapter is its
# place in this list. A chapter is written when its folder has section files NN-<slug>.md.
number: 6
title: The theta correspondence and the Siegel-Weil formula
summary: >-
  The Weil representation, local theta, theta lifts and the seesaw, Bessel periods, the Siegel-Weil formula and the Rallis inner product formula.
