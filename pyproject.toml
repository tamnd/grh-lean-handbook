[project]
name = "ghb"
version = "0.1.0"
description = "The builder of The GRH Lean Handbook: the volumes as PDF and EPUB, checked against lsernau/grh-lean"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "Pillow>=10", "fonttools>=4.40"]

[project.scripts]
ghb = "ghb.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghb"]
